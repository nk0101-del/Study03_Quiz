<!DOCTYPE html>
<!-- 2026-10-08 15:56 KST -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상식 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="selftest" hidden></div>

  <main>
    <section id="screen-start" hidden>
      <p id="student">2601919 김나경</p>
      <h1>상식 퀴즈</h1>
      <p>카테고리를 고르세요. 한 판은 10문제입니다.</p>
      <div class="button-list">
        <button data-category="한국사">한국사</button>
        <button data-category="세계지리">세계지리</button>
        <button data-category="과학">과학</button>
        <button data-category="예술과 문화">예술과 문화</button>
      </div>
    </section>

    <section id="screen-mode" hidden>
      <h1 id="mode-title"></h1>
      <div class="mode-list">
        <button class="mode-button" data-mode="practice">
          <strong>연습 모드</strong>
          <span>시간 제한과 힌트가 없고, 맞히면 1점입니다.</span>
          <span class="notice">순위표에 기록되지 않음</span>
        </button>
        <button class="mode-button" data-mode="speed">
          <strong>스피드 모드</strong>
          <span>문항마다 15초가 주어지고, 시간이 지나면 오답입니다. 맞히면 1점입니다.</span>
        </button>
        <button class="mode-button" data-mode="hint">
          <strong>힌트 모드</strong>
          <span>문항마다 힌트를 1번 쓸 수 있고, 힌트는 오답 보기 2개를 지웁니다. 힌트 없이 맞히면 1점, 힌트를 쓰고 맞히면 0.5점입니다.</span>
        </button>
      </div>
      <button id="btn-mode-back" class="secondary">뒤로</button>
    </section>

    <section id="screen-quiz" hidden>
      <div class="quiz-header">
        <span id="quiz-meta"></span>
        <span id="quiz-progress"></span>
        <span id="quiz-score"></span>
        <span id="quiz-timer" hidden></span>
      </div>
      <h2 id="quiz-question"></h2>
      <div id="choices">
        <button class="choice"></button>
        <button class="choice"></button>
        <button class="choice"></button>
        <button class="choice"></button>
      </div>
      <button id="btn-hint" class="secondary" hidden>힌트 (오답 2개 지우기)</button>
      <div id="feedback" hidden>
        <p id="feedback-verdict"></p>
        <p id="feedback-explanation"></p>
        <a id="feedback-source" target="_blank" rel="noopener"></a>
      </div>
      <button id="btn-next" class="primary" hidden>다음</button>
    </section>

    <section id="screen-result" hidden>
      <h1 id="result-title"></h1>
      <p id="result-score" class="big-score"></p>
      <p id="result-note" class="notice" hidden>순위표에 기록되지 않음</p>
      <p id="retry-summary" hidden></p>
      <p id="retry-all-correct" hidden>모두 맞혔습니다.</p>
      <ol id="result-list"></ol>
      <button id="btn-retry-wrong" class="primary" hidden>틀린 문제 다시 풀기</button>
      <button id="btn-again" class="primary">같은 모드 다시</button>
      <button id="btn-home" class="secondary">처음으로</button>
    </section>

    <section id="screen-error" hidden>
      <h1>문항 데이터에 오류가 있습니다.</h1>
      <ul id="error-list"></ul>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
